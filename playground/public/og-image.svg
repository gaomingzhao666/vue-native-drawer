<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="950" cy="180" r="320" fill="url(#glow)" />
  <circle cx="200" cy="500" r="260" fill="url(#glow)" />

  <!-- Content Container -->
  <g transform="translate(100, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="38" rx="19" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">Vue 3.5</text>

    <!-- Title -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">vue-native-drawer</text>

    <!-- Subtitle -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Native iOS-style drawer (bottom sheet) for Vue 3.</text>
    <text x="0" y="208" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="22" font-weight="400" fill="#64748b">Snap points · Momentum gestures · Rubber banding · Card stacks</text>

    <!-- Tags -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="150" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">TypeScript</text>

      <rect x="165" y="0" width="170" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="250" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Zero CSS bloat</text>

      <rect x="350" y="0" width="160" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="430" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">WAI-ARIA 1.2</text>
    </g>
  </g>

  <!-- Phone Mockup Preview on Right -->
  <g transform="translate(800, 110)" filter="url(#shadow)">
    <!-- Device frame -->
    <rect x="0" y="0" width="280" height="450" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="3" />
    <!-- Background page simulation -->
    <rect x="12" y="12" width="256" height="426" rx="26" fill="#27272a" />
    <rect x="36" y="44" width="120" height="14" rx="7" fill="#52525b" />
    <rect x="36" y="68" width="180" height="10" rx="5" fill="#3f3f46" />
    <rect x="36" y="86" width="150" height="10" rx="5" fill="#3f3f46" />
    
    <!-- Drawer Overlay -->
    <rect x="12" y="12" width="256" height="426" rx="26" fill="#000000" fill-opacity="0.45" />

    <!-- Drawer Sheet -->
    <rect x="12" y="160" width="256" height="278" rx="24" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1" />
    <!-- Drawer Handle -->
    <rect x="122" y="172" width="36" height="5" rx="2.5" fill="#71717a" />
    <!-- Drawer content lines -->
    <rect x="36" y="200" width="90" height="14" rx="4" fill="#ffffff" />
    <rect x="36" y="224" width="150" height="10" rx="4" fill="#a1a1aa" />
    <rect x="36" y="254" width="208" height="44" rx="12" fill="#27272a" />
    <rect x="36" y="308" width="208" height="44" rx="12" fill="#27272a" />
    <rect x="36" y="362" width="208" height="44" rx="12" fill="#0a84ff" />
  </g>
</svg>
